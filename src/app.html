<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Lets CSS hide not-yet-revealed blocks only when JS runs; without JS content stays visible.
			// If the app bundle never starts use:reveal, drop the class so nothing stays hidden.
			document.documentElement.classList.add('js');
			// Keep the envelope closed for guests who opened it earlier in this tab; storage may throw.
			try {
				if (sessionStorage.getItem('envelope-opened')) {
					document.documentElement.classList.add('envelope-opened');
				}
			} catch (e) {}
			setTimeout(function () {
				if (!document.documentElement.hasAttribute('data-reveal-ready')) {
					document.documentElement.classList.remove('js');
				}
			}, 4000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
