name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding
          POSTGRES_DB: wedding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedding" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://wedding:wedding@127.0.0.1:5432/wedding
      USE_FAKE_TELEGRAM: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: svelte-check
        run: pnpm check
      - name: prettier
        run: pnpm exec prettier --check .
      - name: eslint
        run: pnpm exec eslint .
      - name: migrations from scratch
        run: pnpm db:migrate
      - name: migrations match schema
        timeout-minutes: 2
        run: |
          pnpm db:generate
          git status --porcelain -- drizzle
          test -z "$(git status --porcelain -- drizzle)"
      - name: seed
        run: pnpm db:seed
      - name: vitest
        run: pnpm test
      - name: build
        run: pnpm build
      - name: playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
