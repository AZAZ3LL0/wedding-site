name: wedding

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /srv/wedding/shared/postgres.env
    # Published on loopback only: Docker bypasses ufw for published ports.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
